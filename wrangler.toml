name = "bambou-resort-booking-engine"
main = "worker/index.ts"
compatibility_date = "2025-05-01"
# fetch() est global sur le runtime Workers — pas besoin de nodejs_compat.

# Static Assets : le front buildé (dist/) est servi par le binding ASSETS.
# not_found_handling = SPA → /confirmation et autres routes client renvoient index.html.
[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"

# ⚠️ Valeurs NON secrètes : identifiants publics de l'établissement demo. Le secret
# (MEWS_CLIENT) n'est PAS ici — il est fourni en local par .dev.vars (gitignored) et en
# prod par les variables d'environnement Cloudflare (chiffré). Voir README.
[vars]
MEWS_BASE_URL = "https://api.mews-demo.com"
MEWS_APP_BASE_URL = "https://app.mews-demo.com"
MEWS_HOTEL_ID = "3edbe1b4-6739-40b7-81b3-d369d9469c48"
MEWS_CONFIG_ID = "93e27b6f-cba7-4e0b-a24a-819e1b7b388a"
# Catégories d'âge (demo, vérifiées). À remplacer par les UUID réels de l'entreprise en prod.
MEWS_ADULT_AGE_CATEGORY_ID = "5485e2f3-4034-4ca1-8a8f-ade30114c61f"
MEWS_CHILD_AGE_CATEGORY_ID = "fece4b6b-39fa-4ccd-9909-afba0092eeb1"
