name = "bambou-booking"
pages_build_output_dir = "dist"
compatibility_date = "2025-05-01"
# fetch() est global sur le runtime Workers — pas besoin de nodejs_compat a priori.

# ⚠️ Les valeurs ci-dessous ne sont PAS des secrets : ce sont des identifiants publics
# de l'établissement demo. Le secret (MEWS_CLIENT) n'est PAS défini ici — il est fourni
# en local par .dev.vars (gitignored) et en prod par les Environment Variables Cloudflare
# (chiffré / "Encrypt"). Voir README §"Variables d'environnement".
[vars]
MEWS_BASE_URL = "https://api.mews-demo.com"
MEWS_APP_BASE_URL = "https://app.mews-demo.com"
MEWS_HOTEL_ID = "3edbe1b4-6739-40b7-81b3-d369d9469c48"
MEWS_CONFIG_ID = "93e27b6f-cba7-4e0b-a24a-819e1b7b388a"
# Catégories d'âge (demo, vérifiées). À remplacer par les UUID réels de l'entreprise en prod.
MEWS_ADULT_AGE_CATEGORY_ID = "5485e2f3-4034-4ca1-8a8f-ade30114c61f"
MEWS_CHILD_AGE_CATEGORY_ID = "fece4b6b-39fa-4ccd-9909-afba0092eeb1"
